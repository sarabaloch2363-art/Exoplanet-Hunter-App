<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet-Hunter | NASA Data Explorer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Exoplanet-Hunter</h1>
    <br>
    <input type="text" id="search-input" placeholder="Search exoplanet name (e.g., Kepler-22b)...">
    <div class="chart-container">
        <canvas id="planetChart"></canvas>
        <canvas id="orbitalRadiusChart"></canvas>
    </div>
    <div id="planetGrid"></div>
    <script src="script.js"></script>
  </body>
  </html>
